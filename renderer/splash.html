<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPCL - Loading</title>
  <style>
    :root {
      --bg-primary: #0d1425;
      --bg-secondary: #121b30;
      --accent-primary: #4fc3f7;
      --accent-soft: rgba(79, 195, 247, 0.16);
      --accent-glow: rgba(79, 195, 247, 0.22);
      --text-secondary: #9fb0c9;
      --text-dim: #5b6d88;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    }

    body.light-mode {
      --bg-primary: #f4f8fd;
      --bg-secondary: #e8f0f9;
      --accent-primary: #0b7fb8;
      --accent-soft: rgba(11, 127, 184, 0.12);
      --accent-glow: rgba(11, 127, 184, 0.14);
      --text-secondary: #4a6785;
      --text-dim: #9aafc7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 50%, var(--bg-secondary) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 40px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: var(--accent-soft);
      padding: 12px;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo img {
      width: 100%;
      height: 100%;
      border-radius: 18px;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 18px var(--accent-glow);
      }
      50% {
        box-shadow: 0 0 32px var(--accent-glow);
      }
    }

    .brand-name {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 2px;
      text-align: center;
    }

    .brand-name .highlight {
      color: var(--accent-primary);
      font-weight: 700;
    }

    .version-info {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 10px;
    }

    .powered-by {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 5px;
      text-align: center;
    }

    .powered-by a {
      color: var(--text-dim);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .powered-by a:hover {
      color: var(--accent-primary);
    }

    .copyright {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
    }

    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--accent-primary);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.45;
      }
      90% {
        opacity: 0.45;
      }
      100% {
        transform: translateY(-100vh) translateX(20px);
        opacity: 0;
      }
    }

    .fade-out {
      animation: fadeOut 0.5s ease-out forwards;
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="particle-container" id="particles"></div>

  <div class="splash-container" id="splash-content">
    <div class="logo">
      <img src="logo.png" alt="GPCL Logo">
    </div>
    <div class="brand-name">
      <span class="highlight">G</span>ood <span class="highlight">P</span>lan <span class="highlight">C</span>raft <span class="highlight">L</span>auncher
    </div>
    <div class="version-info" id="version-info">-</div>
    <div class="powered-by">
      Powered by <a href="https://www.caellab.com/" target="_blank">虚舟实验室(CaelLab)</a> & You
    </div>
  </div>

  <script>
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 25; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.bottom = '-10px';
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (4 + Math.random() * 4) + 's';
        container.appendChild(particle);
      }
    }

    function detectTheme() {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.body.classList.add('light-mode');
      }
    }

    detectTheme();
    createParticles();

    window.addEventListener('DOMContentLoaded', () => {
      const checkSkipSplash = async () => {
        try {
          if (window.gpcl && window.gpcl.getSettings) {
            const settings = await window.gpcl.getSettings();
            if (settings && settings.appearance && settings.appearance.skipSplash === true) {
              window.location.href = 'index.html';
              return;
            }
          }
        } catch (e) {}

        if (window.gpcl && window.gpcl.getAppVersion) {
          window.gpcl.getAppVersion().then(version => {
            document.getElementById('version-info').textContent = 'v' + version;
          });
        }

        setTimeout(() => {
          const splashContent = document.getElementById('splash-content');
          splashContent.classList.add('fade-out');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);
        }, 2000);
      };

      checkSkipSplash();
    });
  </script>
</body>
</html>
